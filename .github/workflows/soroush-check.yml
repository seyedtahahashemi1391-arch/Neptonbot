name: Soroush Bot Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check bot token
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("BOT_TOKEN")

          if not token:
              print("ERROR: BOT_TOKEN secret is missing")
              raise SystemExit(1)

          url = f"https://api.splus.ir/bot{token}/getMe"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "NeptonBot-Diagnostic/1.0"}
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = json.loads(response.read().decode("utf-8"))

              print("HTTP:", response.status)
              print("API response:")
              print(json.dumps(data, ensure_ascii=False, indent=2))

          except urllib.error.HTTPError as e:
              print("HTTP ERROR:", e.code)
              print("Response:", e.read().decode("utf-8", errors="replace"))
              raise SystemExit(1)

          except Exception as e:
              print("CONNECTION ERROR:", type(e).__name__, str(e))
              raise SystemExit(1)
          PY
