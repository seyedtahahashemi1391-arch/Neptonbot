
name: Soroush Group Permission Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Test group permission
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          token = os.environ.get("BOT_TOKEN")
          if not token:
              raise SystemExit("BOT_TOKEN is missing")

          base = f"https://api.splus.ir/bot{token}/"

          def call(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(
                  base + method,
                  data=data,
                  headers={"Content-Type": "application/json"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  try:
                      return json.loads(e.read().decode())
                  except Exception:
                      return {"ok": False, "error_code": e.code}

          print("1. Requesting group permission...")
          result = call("setMySettings", {
              "can_join_groups": True
          })
          print("SETTINGS RESULT:", json.dumps(
              result, ensure_ascii=False
          ))

          print("2. Checking actual bot settings...")
          me = call("getMe")
          if me.get("ok"):
              bot = me.get("result", {})
              print("BOT:", bot.get("username"))
              print("CAN_JOIN_GROUPS:", bot.get("can_join_groups"))
          else:
              print("GETME ERROR:", json.dumps(
                  me, ensure_ascii=False
              ))
          PY
