services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nepton}
      POSTGRES_USER: ${POSTGRES_USER:-nepton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nepton_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nepton} -d ${POSTGRES_DB:-nepton}"]
      interval: 5s
      timeout: 5s
      retries: 12

  bot:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      PORT: "10000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-nepton}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nepton}
      NEPTON_DB_SSLMODE: disable
      NEPTON_DISABLE_AUTOSTART: "0"
    ports:
      - "${PORT:-10000}:10000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  nepton_postgres_data:
