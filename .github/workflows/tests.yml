name: NeptonBot CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nepton
          POSTGRES_PASSWORD: nepton
          POSTGRES_DB: nepton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nepton -d nepton_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nepton:nepton@localhost:5432/nepton_test
      NEPTON_DB_SSLMODE: disable
      BOT_TOKEN: ci-test-token
      CLOUDFLARE_ACCOUNT_ID: ci-test-account
      CLOUDFLARE_API_TOKEN: ci-test-token
      NEPTON_DISABLE_AUTOSTART: "1"
      NEPTON_AI_MODE: rules
      SENTRY_DSN: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL integration tests
        run: PYTHONPATH=. python tests/postgres_integration.py
